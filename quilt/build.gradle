plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
repositories { maven { url = 'https://maven.quiltmc.org/repository/release/' } }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "org.quiltmc:quilt-loader:${quilt_loader_version}"
    // Fabric Loom does not read quilt_installer.json. Match Quilt 0.30.1's installer libraries.
    implementation 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
    implementation 'org.quiltmc:quilt-json5:1.0.4+final'
    implementation 'org.quiltmc:quilt-config:1.3.3'
    ['asm', 'asm-analysis', 'asm-commons', 'asm-tree', 'asm-util'].each {
        implementation "org.ow2.asm:${it}:9.10.1"
    }
}
loom { runs { client { defaultMainClass = 'org.quiltmc.loader.impl.launch.knot.KnotClient' }; server { defaultMainClass = 'org.quiltmc.loader.impl.launch.knot.KnotServer' } } }
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    systemProperty 'loader.development', 'true'
    systemProperty 'loader.noGui', 'true'
    doFirst {
        def paths = sourceSets.main.output.files.collect { it.absolutePath }.join(File.pathSeparator)
        systemProperty 'loader.classPathGroups', paths
    }
}
